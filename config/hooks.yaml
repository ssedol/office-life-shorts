# 0~3초 후킹 패턴. 생성 프롬프트가 이 목록에서 후보 3개를 만든다.

patterns:
  - id: 1
    name: 시각고정
    when: [A]
    rule: "구체적 요일·시각·행동을 박아 시청자를 그 순간에 데려다 놓는다"
    examples:
      - "월요일 오전 9시 12분, 팀장이 한숨 쉬면"
      - "금요일 오후 5시 40분에 팀장이 자리에서 일어나면"
  - id: 2
    name: 손해경고
    when: [B]
    rule: "당신이 지금 손해 보는 중이라는 신호"
    examples:
      - "이 문장 쓰면 보고서 90% 반려당해요"
  - id: 3
    name: 오답파괴
    when: [A, B]
    rule: "시청자가 믿는 걸 먼저 깬다. 반발심이 체류로 이어진다"
    examples:
      - "일 잘하면 인정받는다? 그거 3년차까지만 맞아요"
  - id: 4
    name: 대상호명
    when: [A, B]
    rule: "특정 집단을 콕 집어 부른다. 해당자는 못 지나간다"
    examples:
      - "팀장 카톡 읽씹당하는 사람"
  - id: 5
    name: 숫자예고
    when: [B]
    rule: "구조를 미리 알려 끝까지 볼 이유를 만든다. 단독 사용 금지, 2·3번과 섞는다"
    examples:
      - "퇴사 통보 전에 반드시 챙길 것 4개"
  - id: 6
    name: 대사인용
    when: [A]
    rule: "나레이션 없이 말소리로 시작. 장면부터"
    examples:
      - "'편하게 말해봐' 라고 하는 팀장한테 편하게 말하면"
  - id: 7
    name: 금기폭로
    when: [A]
    rule: "다들 아는데 말 안 하는 걸 먼저 말한다. 댓글이 가장 많이 달린다"
    examples:
      - "사실 회식 좋아하는 사람 아무도 없어요. 근데 왜"
  - id: 8
    name: 자기부정
    when: [A]
    rule: "시청자의 자책을 먼저 해체한다. 저장·공유가 잘 나온다"
    examples:
      - "퇴근하고 아무것도 못 하겠으면, 게으른 게 아니에요"

rules:
  - "후킹을 먼저 쓰고 본문을 나중에 쓴다. 순서를 바꾸면 늘어진다"
  - "추상어를 구체어로 치환한다. '기분 안 좋을 때' → '마우스를 세게 놓을 때'"
  - "답을 주지 말고 조건만 제시한다. 답을 주면 나갈 이유가 생긴다"
  - "0.0초에 자막이 이미 떠 있어야 한다. 무음 시청자가 많다"

forbidden_openings:
  - "안녕하세요"
  - "오늘은"
  - "혹시 이런 경험"
  - "많은 직장인들이"
  - 로고_인트로
  - 페이드인
