# 채널 고정값 — 사람도 읽고 파이프라인도 읽는다.
# 대본 생성 프롬프트와 검수 스크립트가 모두 이 파일을 참조한다.
# 여기를 고치면 전체 파이프라인의 동작이 바뀐다.

channel:
  name: "office-life-shorts"
  language: ko
  audience:
    primary: "25~40세 사원~과장급 직장인"
    secondary: ["취준생/신입", "팀장급"]

persona:
  role: "3~7년차 실무자. 팀장도 신입도 아닌, 중간에서 다 겪어본 사람"
  register: "구어체 존댓말 (~해요, ~이거든요). 격식체/반말 금지"
  tone_mix:
    위로: 30
    현실인식: 50
    유머: 20

# 검수 스크립트가 강제하는 정량 기준
constraints:
  duration_sec: { min: 35, max: 50, default: 45 }
  # 한국어 나레이션 체감 속도 ≈ 초당 5자 (공백 제외)
  chars_per_sec: 5
  narration_chars: { min: 210, max: 240 }   # 45초 기준
  # HOOK은 본문보다 빠르게 말한다. 3초 구간이지만 22자까지 허용.
  hook_max_chars: 22
  title_max_chars: 25
  hashtags: { min: 3, max: 5, required: ["#shorts"] }
  hook_candidates_min: 3
  thumbnail_text_chars: { min: 4, max: 8 }

# 대본에 등장하면 검수 실패 (FAIL)
banned_phrases:
  - "여러분"
  - "구독자님"
  - "안녕하세요"
  - "알아보겠습니다"
  - "도움이 되셨길"
  - "구독"
  - "좋아요 부탁"
  - "많은 직장인들이"
  - "혹시 이런 경험"

# HOOK 구간에 아래 중 최소 1개가 있어야 통과 (구체성 강제)
hook_concreteness_markers:
  time:  ["월요일", "화요일", "수요일", "목요일", "금요일", "아침", "오전", "오후", "점심", "퇴근", "새벽", "시 ", "분 "]
  rank:  ["팀장", "부장", "과장", "대리", "사원", "상사", "선임", "신입", "대표", "임원"]
  place: ["회의실", "탕비실", "자리", "사무실", "모니터", "엘리베이터", "회식", "단톡방", "메신저"]

safety:
  # 위반 시 파이프라인이 업로드 단계로 넘어가지 않는다
  forbid_identifiable_entities: true      # 실존 회사·인물 특정
  forbid_generational_gender_baiting: true
  forbid_resignation_incitement: true      # "퇴사하세요" 류 선동
  require_ai_disclosure_if_synthetic: true # 합성 음성/영상 사용 시 YouTube 고지 설정
  disclaimer_ko: "본 영상의 사례는 일반적인 상황을 각색한 것이며 특정 인물·회사와 무관합니다."
